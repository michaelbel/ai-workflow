model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
personality = "friendly"
approval_policy = "on-request"
approvals_reviewer = "guardian_subagent"
sandbox_mode = "danger-full-access"
service_tier = "fast"
project_doc_fallback_filenames = [
    "CLAUDE.md",
    "README.md"
]

[mcp_servers.ai-workflow]
command = "npx"
args = ["-y", "@michaelbel/ai-workflow-mcp"]
mcp_servers.ai-workflow.tools.list.approval_mode = "approve"
mcp_servers.ai-workflow.tools.get_rule.approval_mode = "approve"
mcp_servers.ai-workflow.tools.get_skill.approval_mode = "approve"

plugins."computer-use@openai-bundled".enabled = true
plugins."codex-app-tools@openai-bundled".enabled = true
plugins."chrome@openai-bundled".enabled = true
plugins."browser@openai-bundled".enabled = true
plugins."sites@openai-bundled".enabled = true
plugins."visualize@openai-bundled".enabled = true
plugins."github@openai-curated".enabled = true
plugins."figma@openai-curated".enabled = true
plugins."documents@openai-primary-runtime".enabled = true
plugins."spreadsheets@openai-primary-runtime".enabled = true
plugins."presentations@openai-primary-runtime".enabled = true
plugins."pdf@openai-primary-runtime".enabled = true
plugins."template-creator@openai-primary-runtime".enabled = true
